name: Elections Alberta Referendum Tracker

on:
  schedule:
    # Run every 5 minutes during election night
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force scraper run'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run referendum scraper
        run: |
          python scraper.py --once

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Update referendum results: $TIMESTAMP"
            git push
            echo "Results updated and pushed successfully."
          else
            echo "No new results to commit."
          fi
