name: Auto-Update Referendum Returns

on:
  schedule:
    # Backup heartbeat trigger every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger or automated self-dispatch

concurrency:
  group: referendum-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scrape and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 3 cycles spaced 30s apart (~1.5 to 2 minutes total execution)
          for i in {1..3}; do
            echo "--- Scrape cycle $i/3: $(date -u +'%Y-%m-%d %H:%M:%S UTC') ---"
            python3 scraper.py --once
            
            if [ -n "$(git status --porcelain data/)" ]; then
              echo "New returns detected! Committing and pushing..."
              git add data/
              TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
              git commit -m "Auto-update referendum returns: $TIMESTAMP [skip ci]"
              git pull --rebase origin main
              git push origin main
            else
              echo "No data changes detected."
            fi

            if [ $i -lt 3 ]; then
              sleep 30
            fi
          done

      - name: Self-Dispatch Next Run (Continuous Cloud Relay)
        if: always()
        run: |
          # Check if 100% of polls have reported
          IS_COMPLETE=$(python3 -c "
          import json
          try:
              with open('data/latest.json') as f:
                  d = json.load(f)
              s = d.get('turnout', {}).get('summary', {})
              reporting = s.get('pollsReporting', 0)
              total = s.get('totalPolls', 1)
              print('yes' if reporting >= total and total > 0 else 'no')
          except Exception:
              print('no')
          ")

          if [ "$IS_COMPLETE" = "yes" ]; then
            echo "All polls are 100% reported! Final count reached. Stopping automated relay."
          else
            echo "Waiting 30 seconds before queueing the next update cycle..."
            sleep 30
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.DISPATCH_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/update_returns.yml/dispatches \
              -d '{"ref":"main"}'
            echo "Next cycle dispatched successfully!"
          fi
