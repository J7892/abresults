name: Auto-Update Referendum Returns

on:
  schedule:
    # Triggers every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web tab

concurrency:
  group: referendum-scraper
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scrape and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 4 cycles spaced 45s apart per trigger for near continuous updates
          for i in {1..4}; do
            echo "--- Scrape cycle $i/4: $(date -u +'%Y-%m-%d %H:%M:%S UTC') ---"
            python3 scraper.py --once
            
            if [ -n "$(git status --porcelain data/)" ]; then
              echo "New returns detected! Committing and pushing..."
              git add data/
              TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
              git commit -m "Auto-update referendum returns: $TIMESTAMP [skip ci]"
              git pull --rebase origin main
              git push origin main
            else
              echo "No data changes detected."
            fi

            if [ $i -lt 4 ]; then
              sleep 45
            fi
          done
